# Common project settings for all platforms.
#
# Keep this file minimal: only options that BOTH the hardware target and the
# native_sim build genuinely use belong here. Anything specific to a transport
# (e.g. Wi-Fi, its credential storage, or a particular flash backend) lives in
# the per-board files under boards/ so the sim never pulls in target-only code.

# Settings
CONFIG_SETTINGS=y

# GPIO
CONFIG_GPIO=y

# Logging
CONFIG_LOG=y

# Console
CONFIG_SHELL=y

# Memory
#
# Stack sizes are sized for Xtensa (ESP32), whose windowed-register ABI uses
# considerably more stack than ARM/x86; measured high-water marks on hardware
# (kernel thread stacks) showed the previous/default values overflowing, which
# corrupts adjacent kernel memory and hangs the system.
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# Network RX thread: parses DHCP options, reconfigures DNS, dispatches DNS
# responses. Overflowed at its previous size of 2048.
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=3072

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_ETHERNET=y

## Hostname
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="zeppelin"

## Connection Manager configuration
CONFIG_NET_CONNECTION_MANAGER=y
# The upstream default monitor stack is 512 B, which overflows on Xtensa and
# silently corrupts adjacent kernel memory (hangs/crashes within ~30 s of
# network activity). Measured high-water mark on ESP32 was ~1.9 kB.
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=2560
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000

## SNTP time sync
CONFIG_SNTP=y
