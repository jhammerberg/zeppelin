# POSIX simulation (native_sim) specific settings.
#
# Wi-Fi and its credential storage are intentionally NOT enabled here: they
# live only in the hardware board configs, so the sim never drags in
# target-only code (e.g. SHELL_GETOPT vs. host-libc getopt.h conflicts).

# Networking: use Native Simulator Offloaded Sockets (NSOS) instead of the
# TAP/zeth ethernet driver. NSOS forwards the app's BSD socket calls straight
# to the host kernel, so the sim gets the host's real internet access with no
# root, TAP interface, dnsmasq, or NET_ADMIN setup required. DNS (getaddrinfo)
# is served by the host resolver, so SNTP against pool.ntp.org works directly.
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# Simulate the connectivity API so conn_mgr_if_connect() and the
# NET_EVENT_L4_CONNECTED/DISCONNECTED events behave just like on real hardware.
# This keeps the sim and ESP32 application code paths identical (the iface is
# bound to a connectivity backend on both), rather than needing sim-only code.
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS_CONNECTIVITY_SIM=y

# IPv6 Duplicate Address Detection needs lower-level interface access than the
# socket-level NSOS driver exposes, so it must be disabled.
CONFIG_NET_IPV6_DAD=n

# NSOS's connectivity sim brings the interface oper-up but assigns no IP. The
# conn_mgr monitor only raises NET_EVENT_L4_CONNECTED once the iface is both
# oper-up AND has an IP, so assign a static (cosmetic) address at startup.
# Actual traffic egresses via the host socket regardless of this address.
# INIT_TIMEOUT=0 makes net_config assign the address immediately without
# waiting for the iface to be up (it is only brought up later, once the app
# calls conn_mgr_if_connect()), avoiding a startup stall.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

# DHCPv4 is meaningless under NSOS (there is no real L2 to send on) and only
# produces "l2 cannot send, discard pkt" warnings, so disable it for the sim.
# The static address above is all conn_mgr needs to report L4 connectivity.
CONFIG_NET_DHCPV4=n

# Run against real wall-clock time so network round-trips and SNTP timeouts
# behave sensibly against real internet servers.
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y
