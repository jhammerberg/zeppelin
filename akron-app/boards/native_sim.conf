# Overlay applied automatically when building for native_sim.
# Provides an Ethernet interface bridged to a host TAP device (zeth)
# so the app can reach a real network in the simulator, since Wi-Fi
# is not emulated.

# Wi-Fi (CONFIG_WIFI / CONFIG_NET_L2_WIFI_MGMT) is only enabled in
# boards/esp32_devkitc_procpu.conf, so it stays off here by default -- no
# real Wi-Fi hardware in the simulator.

# Native TAP Ethernet driver -> host "zeth" interface.
# (CONFIG_NET_L2_ETHERNET is already enabled in prj.conf.)
CONFIG_ETH_NATIVE_TAP=y

# The default zeth setup script assigns these; DHCP is not used on
# the host side, so configure a static IPv4 address for the sim.
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# Static config instead of DHCP for the emulated link.
CONFIG_NET_DHCPV4=n

# getaddrinfo() allocates its result array from the system heap.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# nat.conf runs dnsmasq on the host-side TAP address.
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="192.0.2.2"
