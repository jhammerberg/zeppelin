# ESP32 specific settings

# Networking

## WiFi
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_CONNECTION_MANAGER_CONNECTIVITY_WIFI_MGMT=y

## Resolve hostnames using DNS servers supplied by DHCP
CONFIG_DNS_RESOLVER=y
# Two slots so the DHCP (IPv4) and router-advertisement (IPv6) DNS servers do
# not evict each other from a single-entry list (the default is 1, which made
# name resolution depend on which source configured itself last).
CONFIG_DNS_RESOLVER_MAX_SERVERS=2

## Wi-Fi credentials library (used to pre-configure/store credentials)
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y

## Persistent storage backing the credentials library
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

