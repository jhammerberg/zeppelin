# Overlay applied automatically when building for esp32_devkitc.
# Wi-Fi / real-hardware-specific settings live here so the common
# prj.conf stays board-agnostic (e.g. native_sim disables Wi-Fi).

# Real Wi-Fi hardware + management L2.
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y

# The AP assigns addresses over DHCP on real hardware.
CONFIG_NET_DHCPV4=y
